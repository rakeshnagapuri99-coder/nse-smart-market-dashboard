name: Test Scanner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run batch scanner
        run: |
          python scanner.py

      - name: Show generated files
        run: |
          echo "======================================"
          echo "OUTPUT FILES"
          echo "======================================"
          ls -lah output

      - name: Show CSV preview
        run: |
          echo "======================================"
          echo "TECHNICAL SCAN CSV"
          echo "======================================"
          if [ -f output/technical_scan_test.csv ]; then
            head -10 output/technical_scan_test.csv
          else
            echo "CSV file was not created"
            exit 1
          fi
