name: Test Scanner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ranked scanner
        run: |
          python scanner.py

      - name: Show generated files
        run: |
          echo "======================================"
          echo "OUTPUT FILES"
          echo "======================================"
          ls -lah output

      - name: Show ranked CSV preview
        run: |
          echo "======================================"
          echo "RANKED SCAN CSV"
          echo "======================================"

          if [ -f output/technical_ranked_test.csv ]; then
            head -10 output/technical_ranked_test.csv
          else
            echo "Ranked CSV file was not created"
            exit 1
          fi

      - name: Show setup summary
        run: |
          echo "======================================"
          echo "SETUP SUMMARY"
          echo "======================================"

          if [ -f output/setup_summary_test.csv ]; then
            cat output/setup_summary_test.csv
          else
            echo "Setup summary file was not created"
            exit 1
          fi
