name: Update NSE Smart Market Dashboard

on:
  workflow_dispatch:

  schedule:
    # Monday to Friday
    # 13:00 UTC = 18:30 IST
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

jobs:

  update-dashboard:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"


      # ------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # 4. Run production scanner
      # ------------------------------------------------------

      - name: Run NSE Smart Market Scanner
        run: |
          python scanner.py


      # ------------------------------------------------------
      # 5. Verify dashboard data
      # ------------------------------------------------------

      - name: Verify dashboard output
        run: |

          echo "======================================"
          echo "DASHBOARD OUTPUT"
          echo "======================================"

          if [ ! -f output/dashboard_data.json ]; then
            echo "Dashboard JSON was not created"
            exit 1
          fi

          if [ ! -f output/stocks.csv ]; then
            echo "Stocks CSV was not created"
            exit 1
          fi

          if [ ! -f output/market_regime.csv ]; then
            echo "Market regime CSV was not created"
            exit 1
          fi

          if [ ! -f output/market_breadth.csv ]; then
            echo "Market breadth CSV was not created"
            exit 1
          fi

          echo ""
          echo "Dashboard files created successfully."

          echo ""
          echo "Output directory:"
          ls -lah output


      # ------------------------------------------------------
      # 6. Commit generated data
      # ------------------------------------------------------

      - name: Commit updated dashboard data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git add output/

          if git diff --cached --quiet; then

            echo "No dashboard data changes detected."

          else

            git commit \
              -m "Update market dashboard data"

            git push

          fi
