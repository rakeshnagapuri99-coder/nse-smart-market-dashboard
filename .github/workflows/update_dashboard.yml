name: Update NSE Smart Market Dashboard

on:
  workflow_dispatch:

  schedule:
    # Monday-Friday
    # 13:00 UTC = 18:30 IST
    - cron: "0 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "nse-dashboard"
  cancel-in-progress: false

jobs:

  update-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Run production scanner
      # ------------------------------------------------------

      - name: Run NSE Smart Market Scanner
        run: |
          python scanner.py

      # ------------------------------------------------------
      # 5. Verify production output
      # ------------------------------------------------------

      - name: Verify dashboard output
        run: |

          echo "======================================"
          echo "VERIFYING DASHBOARD OUTPUT"
          echo "======================================"

          required_files=(
            "output/dashboard_data.json"
            "output/stocks.csv"
            "output/market_regime.csv"
            "output/market_breadth.csv"
            "output/sector_analysis.csv"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then

              echo "ERROR: Missing $file"
              exit 1

            fi

            echo "OK: $file"

          done

          echo ""
          echo "Dashboard output verified."

          echo ""
          echo "Output directory:"
          ls -lah output

          echo ""
          echo "Excel exports:"
          ls -lah output/exports || true

      # ------------------------------------------------------
      # 6. Commit market data
      # ------------------------------------------------------

      - name: Commit updated market data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git add output/

          if git diff --cached --quiet; then

            echo "No market-data changes detected."

          else

            git commit \
              -m "Update market dashboard data"

            git push

          fi

      # ------------------------------------------------------
      # 7. Configure GitHub Pages
      # ------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------
      # 8. Prepare static website
      # ------------------------------------------------------

      - name: Prepare Pages site
        run: |

          rm -rf site

          mkdir -p site
          mkdir -p site/assets
          mkdir -p site/output
          mkdir -p site/output/exports

          # Main dashboard
          cp index.html site/

          # Dashboard assets
          cp assets/dashboard.css site/assets/
          cp assets/dashboard.js site/assets/
          cp assets/portfolio.js site/assets/

          # Dashboard data
          cp output/dashboard_data.json \
             site/output/

          # Excel exports
          cp output/exports/*.xlsx \
             site/output/exports/ \
             2>/dev/null || true

          echo ""
          echo "Pages site:"
          find site -maxdepth 3 -type f | sort

      # ------------------------------------------------------
      # 9. Upload Pages artifact
      # ------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ------------------------------------------------------
      # 10. Deploy
      # ------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
