name: Update NSE Smart Market Dashboard

on:
  workflow_dispatch:

  schedule:
    # Monday to Friday
    # 13:00 UTC = 18:30 IST
    - cron: "0 13 * * 1-5"


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write
  pages: write
  id-token: write


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: "nse-smart-market-dashboard"
  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  update-and-deploy:

    runs-on: ubuntu-latest


    # ========================================================
    # ENVIRONMENT
    # ========================================================

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. RUN PRODUCTION SCANNER
      # ======================================================

      - name: Run NSE Smart Market Scanner
        run: |
          echo "=============================================="
          echo "NSE SMART MARKET DASHBOARD"
          echo "PRODUCTION SCAN"
          echo "=============================================="
          echo ""

          python scanner.py


      # ======================================================
      # 5. VERIFY OUTPUT
      # ======================================================

      - name: Verify dashboard output
        run: |

          echo "=============================================="
          echo "VERIFYING OUTPUT FILES"
          echo "=============================================="

          REQUIRED_FILES="
          output/dashboard_data.json
          output/stocks.csv
          output/market_regime.csv
          output/market_breadth.csv
          output/sector_analysis.csv
          output/technical_scan.csv
          output/fundamentals.csv
          output/setup_summary.csv
          "

          for file in $REQUIRED_FILES
          do
            if [ ! -f "$file" ]; then
              echo ""
              echo "ERROR: Missing required file:"
              echo "$file"
              echo ""
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "=============================================="
          echo "ALL REQUIRED FILES CREATED"
          echo "=============================================="

          echo ""
          echo "Output directory:"
          find output -maxdepth 2 -type f | sort


      # ======================================================
      # 6. VERIFY DASHBOARD JSON
      # ======================================================

      - name: Validate dashboard JSON
        run: |

          echo "Validating dashboard_data.json..."

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/dashboard_data.json")

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          required_keys = [
              "dashboard",
              "generated_at",
              "market_regime",
              "market_breadth",
              "sector_analysis",
              "stocks",
              "watchlists",
              "watchlist_counts"
          ]

          missing = [
              key for key in required_keys
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"Missing dashboard JSON keys: {missing}"
              )

          print("Dashboard JSON validation successful.")
          print(
              "Stocks:",
              len(data.get("stocks", []))
          )

          print(
              "Watchlists:",
              list(
                  data.get(
                      "watchlists",
                      {}
                  ).keys()
              )
          )
          PY


      # ======================================================
      # 7. CONFIGURE GITHUB PAGES
      # ======================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ======================================================
      # 8. BUILD STATIC WEBSITE
      # ======================================================

      - name: Build GitHub Pages site
        run: |

          echo "=============================================="
          echo "BUILDING GITHUB PAGES SITE"
          echo "=============================================="

          rm -rf site

          mkdir -p site
          mkdir -p site/assets
          mkdir -p site/output
          mkdir -p site/output/exports

          # --------------------------------------------------
          # Main dashboard
          # --------------------------------------------------

          cp index.html site/


          # --------------------------------------------------
          # Dashboard assets
          # --------------------------------------------------

          cp assets/dashboard.css site/assets/
          cp assets/dashboard.js site/assets/
          cp assets/portfolio.js site/assets/


          # --------------------------------------------------
          # Dashboard JSON
          # --------------------------------------------------

          cp output/dashboard_data.json \
             site/output/


          # --------------------------------------------------
          # CSV data
          # --------------------------------------------------

          cp output/*.csv \
             site/output/ 2>/dev/null || true


          # --------------------------------------------------
          # Excel exports
          # --------------------------------------------------

          cp output/exports/*.xlsx \
             site/output/exports/ 2>/dev/null || true


          # --------------------------------------------------
          # Prevent Jekyll processing
          # --------------------------------------------------

          touch site/.nojekyll


          # --------------------------------------------------
          # Display final site structure
          # --------------------------------------------------

          echo ""
          echo "GitHub Pages site:"
          find site -maxdepth 3 -type f | sort


      # ======================================================
      # 9. UPLOAD PAGES ARTIFACT
      # ======================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


      # ======================================================
      # 10. COMMIT MARKET DATA
      # ======================================================

      - name: Commit updated dashboard data
        run: |

          echo "=============================================="
          echo "COMMITTING UPDATED MARKET DATA"
          echo "=============================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git add output/

          if git diff --cached --quiet
          then
            echo "No dashboard data changes detected."
          else

            git commit \
              -m "Update market dashboard data"

            git push

          fi


      # ======================================================
      # 11. DEPLOY TO GITHUB PAGES
      # ======================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
